[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-engine"
version = "0.1.0"
description = "Lightweight Sports Intelligence Engine starting with Turkish Süper Lig pre-match analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sports Engine Team" }
]
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "fastparquet>=2024.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "penaltyblog>=1.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --ignore=tests/test_task014_smoke.py --ignore=tests/manual"
norecursedirs = [".git", ".agents", "artifacts", "output", "scripts", "scratch", "tests/manual"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "UP042", "E402", "N815", "F841", "B007", "N806", "E701"]
