name: Daily Sports Intelligence Terminal & Telegram Digest

on:
  schedule:
    # 11:00, 15:00, 19:00 TRT (UTC+3) -> 08:00, 12:00, 16:00 UTC
    - cron: "0 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-sports-terminal"
  cancel-in-progress: false

jobs:
  build-and-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run daily fair-odds pipeline (fail-soft on remote IP block)
        continue-on-error: true
        run: |
          python scripts/run_daily_prototype.py --no-ui-sync

      - name: Build static UI bundle and snapshot_data.js
        run: |
          python ui/build_bundle.py

      - name: Upload collected Nesine DB & report snapshot (persist data across runs)
        uses: actions/upload-artifact@v4
        with:
          name: nesine-passive-data-${{ github.run_number }}
          path: |
            output/nesine_odds_timeseries.db
            output/daily_prototype_report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Send Telegram fair-odds digest (disabled in passive mode unless vars.ENABLE_TELEGRAM_SIGNALS == 'true')
        if: vars.ENABLE_TELEGRAM_SIGNALS == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APE_ENABLE_TELEGRAM_SIGNALS: "1"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python scripts/send_daily_telegram_digest.py --enable-send
          else
            echo "Telegram secrets not configured; skipping digest."
          fi

      - name: Upload ui/ artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui

  deploy-pages:
    needs: build-and-digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
