<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APE Adil Oran &amp; Marj Terminali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="terminal-layout">
    <!-- Navbar Component will be rendered here -->
    <header id="navbar-container"></header>

    <!-- Main Viewport where screens will be swapped -->
    <main id="view-container" class="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>APE Adil Oran Terminali yükleniyor...</p>
      </div>
    </main>

    <!-- Global Terminal Footer -->
    <footer class="terminal-footer">
      <div class="footer-left">
        <span class="system-indicator pulse"></span>
        <span class="system-status">MOTOR: AKTİF</span>
        <span class="separator">|</span>
        <span class="source-tag">VERİ: NESİNE BÜLTENİ &amp; SHIN ADİL ORAN ARINDIRMA</span>
        <span class="separator">|</span>
        <span class="audit-tag">KALİTE: SPEC-0012 DOĞRULANDI</span>
      </div>
      <div class="footer-right">
        <span class="disclaimer-text">YASAL UYARI: Oran ve marj analizi terminalidir. Otomatik bahis, yatırım tavsiyesi veya kazanç garantisi içermez.</span>
      </div>
    </footer>
  </div>

  <!-- Preloaded Data for Zero-Server / file:/// direct path support -->
  <script src="data/snapshot_data.js"></script>
  <!-- Unified Production Bundle (Supports both file:/// and http://localhost:8000/ui/) -->
  <script src="bundle.js"></script>
</body>
</html>
